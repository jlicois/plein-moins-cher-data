name: Build daily fuel-price history

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/history.yml"
      - "scripts/build_history.py"

permissions:
  contents: write

concurrency:
  group: fuel-history-data
  cancel-in-progress: false

jobs:
  prepare-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import official price history and publish static shards
        run: python scripts/build_history.py
