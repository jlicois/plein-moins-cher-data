name: Build daily fuel-price history

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/history.yml"
      - "scripts/build_history.py"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fuel-history-pages
  cancel-in-progress: false

jobs:
  prepare-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import official daily snapshots and build shards
        run: python scripts/build_history.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy history API
        id: deployment
        uses: actions/deploy-pages@v4
